[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daily-knowledge-learning"
version = "0.1.0"
description = "A learning project for building a safe Obsidian-backed study assistant."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "pyside6>=6.8",
]

[project.scripts]
daily-learning = "daily_knowledge_learning.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pyinstaller>=6.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/daily_knowledge_learning"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
