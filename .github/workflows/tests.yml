name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt runtime libraries and Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 fonts-noto-cjk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - run: uv sync
      - run: uv run pytest
